plugins {
    id "com.android.application"
}

android {
    namespace "com.cfdata.web"
    compileSdk 35

    signingConfigs {
        // 测试包固定签名：CI 每次构建都用同一个 debug keystore，
        // 否则每台 Runner 现生成的 debug 密钥都不同，新包无法覆盖安装旧包。
        // 这只是 debug 测试密钥（与默认 debug 密钥同等性质），不是发布密钥。
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            def storeFilePath = System.getenv("ANDROID_KEYSTORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    defaultConfig {
        applicationId "com.cfdata.web"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName System.getenv("ANDROID_VERSION_NAME") ?: "1.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".test"
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

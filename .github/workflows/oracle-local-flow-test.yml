name: Oracle local-flow Android debug APK
on:
  push:
    branches:
      - feature/android-oracle-local-flow
permissions:
  contents: read
jobs:
  build-debug-apk:
    name: Build arm64 backend and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: combined_refactor/go.mod
          cache: true
          cache-dependency-path: combined_refactor/go.sum
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"
      - name: Download embedded CA bundle
        run: |
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 10 \
            https://curl.se/ca/cacert.pem \
            --output combined_refactor/ca-certificates.crt
      - name: Build Android arm64 Go backend
        working-directory: combined_refactor
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: go build -trimpath -o ../app/src/main/jniLibs/arm64-v8a/libcfdata.so .
      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon
      - name: Verify debug APK and embedded arm64 backend
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -l "$apk" | grep -F 'lib/arm64-v8a/libcfdata.so'
      - name: Upload the APK test artifact
        uses: actions/upload-artifact@v7
        with:
          name: cfdata-oracle-local-flow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
